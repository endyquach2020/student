<!-- KHUNG MÔ PHỎNG MÃ MORSE SOS -->
<div id="morseSimulatorBox" class="h-44 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-xl flex-shrink-0 hidden">
  <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-1.5 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center space-x-2">
      <i data-lucide="radio" class="w-4 h-4 text-red-400 animate-pulse"></i>
      <span class="text-xs font-bold uppercase tracking-wider text-red-300">Trạm Tín Hiệu Khẩn Cấp (Morse Beacon)</span>
    </div>
    <span class="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded border border-red-500/30">Chuẩn Quốc Tế SOS</span>
  </div>
  
  <div class="flex-1 bg-slate-950 p-3 flex items-center justify-around">
    <!-- Đèn cứu nạn khẩn cấp -->
    <div class="flex flex-col items-center space-y-1.5">
      <div id="morseLed" class="w-14 h-14 rounded-full bg-red-950 border-4 border-red-900 flex items-center justify-center font-extrabold text-xs text-red-200 transition-all duration-150">
        SOS
      </div>
      <span class="text-[10px] text-slate-400 font-mono">ĐÈN TÍN HIỆU CỨU HỘ</span>
    </div>

    <!-- Dải hiển thị chuỗi xung Morse trực quan -->
    <div class="text-xs space-y-1.5 text-slate-300">
      <div class="flex items-center space-x-2">
        <span>Tín hiệu phát sóng:</span>
        <span id="morseLiveSignal" class="font-mono font-bold text-amber-400 text-sm tracking-widest">[ Chờ phát... ]</span>
      </div>
      <div class="text-[11px] text-slate-400">Chuẩn mã hóa: <b>S ( · · · )</b> | <b>O ( — — — )</b> | <b>S ( · · · )</b></div>
      <div class="text-[10px] text-emerald-400 font-mono">Tự động kiểm tra độ trễ xung ngắn/dài thời gian thực</div>
    </div>
  </div>
</div>
